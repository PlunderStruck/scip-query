name: Dependency security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  production-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Reject high-severity production advisories
        run: npm run audit:prod

  runtime-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Exercise the runtime contract and native database boundary
        run: >-
          npx vitest run
          tests/scripts/runtime-support-contract.test.ts
          tests/storage/db-lifecycle.test.ts
